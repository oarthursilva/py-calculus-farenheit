ID: calculus-fahrenheit-api
_schema-version: "3.3.0"
version: 1.0.0

modules:
  - name: calculus-fahrenheit-approuter
    type: approuter.nodejs
    path: ../cap/approuter
    parameters:
      memory: 128M
      # disk-quota: 2048M
      buildpack: python_buildpack
      # space alvo: mcp  ->  host atem-abap-mcp-server-mcp
      host: calculus-fahrenheit-${space}
      # domain: cfapps.br10.hana.ondemand.com
      health-check-type: http
      health-check-http-endpoint: /health
      # Unico ponto que define o comando de start (nao ha Procfile)
      # command: python src/aws_abap_accelerator/enterprise_main.py
    requires:
      - name: calculus-fahrenheit-api-uaa
      - name: srv_api
        group: destinations
        properties:
          name: srv_api
          url: ~{url}
          forwardAuthToken: true

  - name: calculus-fahrenheit-api
    type: python
    path: ../cap/api/
    parameters:
      memory: 64M
      disk-quota: 512M
      host: calculus-fahrenheit-api-${space}
      domain: cfapps.br10.hana.ondemand.com
    provides:
      - name: srv_api
        properties:
          url: ${default-url}
    requires:
      - name: calculus-fahrenheit-api-uaa

# resources:
